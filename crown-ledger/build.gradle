plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = 'realm-treasury' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url='https://cursemaven.com'; content { includeGroup 'curse.maven' } } }
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods { kingdomtreasury { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('integrationTests').isPresent()) {
        localRuntime fileTree(dir: 'compat-libs', include: ['*.jar'])
    }
    if(providers.gradleProperty('loanWalletTests').isPresent()) {
        localRuntime files('../mod-pronto/realm-origins-0.5.7.jar')
        localRuntime 'curse.maven:origins-neoforge-1375372:8758523'
        localRuntime 'curse.maven:jupiter-1072905:7738312'
        localRuntime 'curse.maven:origins-classes-neoforge-1536425:8758587'
    }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test', Test) { useJUnitPlatform() }
if (providers.gradleProperty('crownGameTests').isPresent()) {
    sourceSets.main.java.srcDir('src/gametest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
}
if(providers.gradleProperty('loanGameTests').isPresent()) {
    sourceSets.main.java.srcDirs('src/gametest/java','src/loantest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
    neoForge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces','treasuryloans'
}
if(providers.gradleProperty('loanClientTests').isPresent()) {
    sourceSets.main.java.srcDir('src/loanclienttest/java')
    neoForge.runs.client {
        gameDirectory=file('run-loan-qa')
        systemProperty 'loans.qaOutput',file('qa-results/loans-client').absolutePath
        programArguments.addAll '--width','1600','--height','900'
    }
}
if (providers.gradleProperty('crownVisualTests').isPresent()) {
    sourceSets.main.java.srcDir('src/visualtest/java')
    neoForge.runs.client {
        systemProperty 'crown.qaOutput', file('qa-results/crown-client').absolutePath
        programArguments.addAll '--width', '1600', '--height', '900'
    }
}
tasks.named('jar', Jar) {
    exclude('pt/crownledger/test/**', 'pt/crownledger/visualtest/**', 'data/kingdomtreasury/structure/**')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
if (providers.gradleProperty('treasuryClientTests').isPresent()) {
    sourceSets.main.java.srcDir('src/clienttest/java')
    neoForge.runs.client {
        gameDirectory = file('run-treasury-qa')
        systemProperty 'treasury.qaOutput', file('qa-results/treasury-lan').absolutePath
        programArguments.addAll '--width', '1600', '--height', '900'
    }
}
tasks.named('jar', Jar) { exclude('pt/crownledger/clienttest/**','pt/crownledger/loanclienttest/**','data/treasuryloans/structure/**') }
