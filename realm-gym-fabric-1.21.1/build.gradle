plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java-library'
}
version = mod_version
group = mod_group_id
base { archivesName = 'realm-gym' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def shared = layout.buildDirectory.dir('generated/sources/shared')
tasks.register('prepareSharedJava', Sync) {
    from('../realm-gym/src/main/java') {
        include 'pt/realmfitness/GymNutrition.java', 'pt/realmfitness/RecoveryView.java', 'pt/realmfitness/ProteinItem.java',
            'pt/realmfitness/ConditioningCommands.java', 'pt/realmfitness/domain/**', 'pt/realmfitness/GymGeometry.java', 'pt/realmfitness/GymLayout.java',
            'pt/realmfitness/GymBlock.java', 'pt/realmfitness/RecordBoardBlock.java',
            'pt/realmfitness/client/AthleteScreen.java', 'pt/realmfitness/client/RoutineEditorScreen.java',
            'pt/realmfitness/client/GymMenu.java', 'pt/realmfitness/client/FitnessRig.java', 'pt/realmfitness/client/FitnessTheme.java',
            'pt/realmfitness/client/MinigameHudRenderer.java', 'pt/realmfitness/client/TrainingPresentation.java',
            'pt/realmfitness/client/ExercisePose.java', 'pt/realmfitness/client/RecordBoardRenderer.java'
    }
    into shared
}
sourceSets.main.java.srcDir shared
sourceSets.test.java.srcDir '../realm-gym/src/test/java'
tasks.named('processResources') {
    from('../realm-gym/src/main/resources') { exclude 'data/realmfitness/recipe/whey_from_cooking_pot.json' }
}
tasks.named('compileJava') { dependsOn 'prepareSharedJava' }
tasks.named('processResources') {
    exclude 'META-INF/**', 'pack.mcmeta'
    filesMatching('fabric.mod.json') {
        expand version: project.version, loader: loader_version, api: fabric_version
        if (project.hasProperty('fitnessGameTests')) filter { line -> line.replace('"main":', '"fabric-gametest": ["pt.realmfitness.test.FitnessGameTests"], "main":') }
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
if (providers.gradleProperty('fitnessGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
if (providers.gradleProperty('fitnessVisualTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/visualtest/java'
}
loom {
    runs {
        client {
            runDir 'run'
            if (project.hasProperty('fitnessVisualTests')) {
                vmArg '-Dfitness.qaOutput=' + file('qa-results/client').absolutePath
                vmArg '-Dfitness.visualTests=true'
                programArgs '--width', '1600', '--height', '900'
            }
        }
        server { programArg '--nogui' }
        gametest {
            server()
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=' + file('qa-results/native.xml').absolutePath
        }
    }
}
tasks.named('jar', Jar) { exclude 'pt/realmfitness/test/**', 'pt/realmfitness/visualtest/**', 'data/realmfitness/structure/empty.nbt' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
