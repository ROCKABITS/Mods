name: Build Laws & Justice
on:
  push:
    branches: [main]
    paths:
      - 'laws-justice/**'
      - 'crown-ledger/**'
      - '.github/workflows/build-laws-justice.yml'
      - '.github/scripts/justice_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laws-justice-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Publish this mod only when its source commit explicitly requests a release.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[laws-justice-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Laws & Justice and Crown production JARs and unit suites
        run: python3 .github/scripts/justice_release.py build
      - name: Snapshot fixture-free production JARs from this commit
        run: python3 .github/scripts/justice_release.py snapshot
      - name: Native independent custody suite
        run: python3 .github/scripts/justice_release.py native
      - name: Install fresh finance counterparts and verified roleplay companions
        run: python3 .github/scripts/justice_release.py install
      - name: Native custody, persistence and recovery integration
        working-directory: laws-justice
        run: python3 ../.github/scripts/justice_release.py integrated
      - name: Actual Minecraft prison blocks and justice interfaces
        working-directory: laws-justice
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 660s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PjusticeVisualTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/justice-client/result.json')); assert r.get('success') is True, r"
      - name: Actual Minecraft Crown chest and production menus
        working-directory: crown-ledger
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PcrownVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/crown-client/result.json')); assert r.get('success') is True, r"
      - name: Validation summary and bounded failure diagnostics
        if: always()
        run: python3 .github/scripts/justice_release.py summary
      - name: Gate and package tested release
        run: python3 .github/scripts/justice_release.py package
      - name: Downloadable tested release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laws-justice-release-${{ github.run_id }}
          path: |
            laws-justice/build/justice-release/downloads/
            media/laws-justice/
            media/crown-ledger/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested release in one commit
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/justice_release.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish jointly tested Laws & Justice and Crown Ledger [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: justice-validation-${{ github.run_id }}
          path: |
            */build.log
            */gametests.log
            crown-ledger/integration.log
            crown-ledger/visual-client.log
            crown-ledger/qa-results/
            laws-justice/integration.log
            laws-justice/visual-client.log
            */build/test-results/test/
            laws-justice/build/justice-release/manifest.json
            laws-justice/build/justice-release/companions.json
            laws-justice/qa-results/
            laws-justice/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
