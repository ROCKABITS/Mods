name: Build Season 8
on:
  push:
    branches: [main]
    paths: ['season-eight/**', '.github/workflows/build-season-eight.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: season-eight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: season-eight
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper
        run: echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Production build and layout regression suite
        run: |
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
          mkdir -p build/release
          cp build/libs/season-eight-*.jar build/release/
      - name: Virtual display
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
      - name: Real Minecraft standalone menu and loading
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PseasonQa runClient 2>&1 | tee standalone.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
          mv qa-results/client qa-results/standalone
      - name: Install 13 verified released companions
        run: python3 tools/release.py install
      - name: Real Minecraft with all released realm mods
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PseasonQa -PseasonIntegration runClient 2>&1 | tee integration.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
          mv qa-results/client qa-results/integration
      - name: Gate production JAR and real screenshots
        run: python3 tools/release.py package
      - name: Downloads and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: season-eight-${{ github.run_id }}
          path: |
            mod-pronto/season-eight-*
            media/season-eight/
            season-eight/qa-results/
            season-eight/build/test-results/test/
            season-eight/build.log
            season-eight/standalone.log
            season-eight/integration.log
          retention-days: 30
      - name: Publish tested release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during verification; run against latest main.'
            exit 1
          fi
          git add -- mod-pronto/season-eight-* media/season-eight/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Season 8 0.1.0 [skip ci]'
          git push origin HEAD:refs/heads/main
