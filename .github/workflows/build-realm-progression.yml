name: Build Realm Progression
on:
  push:
    branches: [main]
    paths: ['realm-progression/**', '.github/scripts/progression_release.py', '.github/workflows/build-realm-progression.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-progression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realm-progression-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Treasury, companions and Create 6.0.10
        run: python3 .github/scripts/progression_release.py install
      - name: Build fixture-free production JAR and unit suite
        run: python3 .github/scripts/progression_release.py build
      - name: Native crafting, permissions, durable unlocks and storage faults
        run: python3 .github/scripts/progression_release.py native
      - name: Native suite with actual Create and roleplay companions
        run: python3 .github/scripts/progression_release.py integrated
      - name: Two actual Minecraft LAN clients, administration, Create crafting and world reopening
        working-directory: realm-progression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 960s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PprogressionVisualTests -PcreateTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 ../.github/scripts/progression_release.py validate
      - name: Gate and package tested addon
        run: python3 .github/scripts/progression_release.py package
      - name: Downloadable production addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-progression-${{ github.run_id }}
          path: |
            mod-pronto/realm-progression-0.1.0.*
            media/realm-progression/0.1.0/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified JAR, ZIP and actual screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation; build the latest source.'
            exit 1
          fi
          python3 .github/scripts/progression_release.py stage
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Realm Progression 0.1.0 [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: progression-validation-${{ github.run_id }}
          path: |
            realm-progression/*.log
            realm-progression/build/test-results/test/
            realm-progression/build/release/manifest.json
            realm-progression/qa-results/
            realm-progression/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
