name: Build daily quests and Crown Ledger
on:
  push:
    branches: [main]
    paths:
      - 'contracts-bounties/**'
      - 'crown-ledger/**'
      - '.github/workflows/build-daily-quests.yml'
      - '.github/scripts/daily_release.py'
      - '.github/scripts/economy_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-quests-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[daily-quests-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Production builds and unit tests
        run: python3 .github/scripts/daily_release.py build
      - name: Snapshot production JARs before fixtures
        run: python3 .github/scripts/daily_release.py snapshot
      - name: Existing Contracts and Crown tests and standalone daily tests
        run: python3 .github/scripts/daily_release.py native
      - name: Install fresh Crown and verified optional companions
        run: python3 .github/scripts/daily_release.py install
      - name: Integrated survival, governance, wallet, treasury and failure recovery
        run: python3 .github/scripts/daily_release.py integrated
      - name: Real Minecraft menus, cinematics, LAN host and world reopen
        working-directory: contracts-bounties
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 900s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PdailyVisualTests -PdailyIntegration runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/daily-client/result.json')); assert r.get('success') is True,r"
      - name: Bounded validation diagnostics
        if: always()
        run: python3 .github/scripts/daily_release.py summary
      - name: Gate and package immutable tested releases
        run: python3 .github/scripts/daily_release.py package
      - name: Downloadable tested JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-quests-release-${{ github.run_id }}
          path: |
            contracts-bounties/build/daily-release/downloads/
            media/contracts-bounties/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested releases together
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/daily_release.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested daily quests and Crown Ledger [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-validation-${{ github.run_id }}
          path: |
            contracts-bounties/build.log
            crown-ledger/build.log
            */gametests.log
            contracts-bounties/daily-gametests.log
            contracts-bounties/daily-integration.log
            contracts-bounties/visual-client.log
            */build/test-results/test/
            contracts-bounties/build/daily-release/*.json
            contracts-bounties/qa-results/daily-client/
            contracts-bounties/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
