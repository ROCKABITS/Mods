name: Build Realm Council

on:
  push:
    branches: [main]
    paths:
      - 'realm-council/**'
      - '.github/workflows/build-realm-council.yml'
      - '.github/scripts/package_realm.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realm-council-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: realm-council
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Native block and access tests
        run: ./gradlew --no-daemon --console=plain -PrpGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Validation summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/package_realm.py --summary
      - name: Package tested mod
        working-directory: .
        run: python3 .github/scripts/package_realm.py
      - name: Publish tested JAR and ZIP
        working-directory: .
        run: |
          version=$(sed -n 's/^mod_version=//p' realm-council/gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Run against latest main.'
            exit 1
          fi
          git add -- "mod-pronto/realmcouncil-$version.jar" "mod-pronto/realmcouncil-$version.zip" "mod-pronto/realmcouncil-$version.sha256" "mod-pronto/realmcouncil-$version.build.json"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested Realm Council $version [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realm-council-validation-${{ github.run_id }}
          path: |
            realm-council/build.log
            realm-council/gametests.log
            realm-council/build/test-results/test/
            realm-council/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
