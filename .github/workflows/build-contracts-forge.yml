name: Build Contracts Forge 1.20.1
on:
  push:
    branches: [main]
    paths:
      - 'contracts-bounties-forge-1.20.1/**'
      - 'contracts-bounties/src/main/resources/**'
      - '.github/scripts/contracts_forge_release.py'
      - '.github/workflows/build-contracts-forge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contracts-forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: contracts-bounties-forge-1.20.1
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify official Forge MDK wrapper
        run: echo 'ed2c26eba7cfb93cc2b7785d05e534f07b5b48b5e7fc941921cd098628abca58  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Build reobfuscated production JAR and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee forge-build.log
      - name: Snapshot production JAR
        run: python3 ../.github/scripts/contracts_forge_release.py snapshot
      - name: Native board, inventory and persistence tests
        run: ./gradlew --no-daemon --console=plain runGameTestServer 2>&1 | tee forge-native.log
      - name: Prepare graphics
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
      - name: Actual Minecraft models and visual item selection
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 480s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PboardVisualTests runClient 2>&1 | tee forge-visual.log
          python3 -c "import json; r=json.load(open('qa-results/boards-client/result.json')); assert r.get('success') is True, r"
      - name: Actual Forge channels, quest payments and world reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 660s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PforgeIntegrationTests runClient 2>&1 | tee forge-integration.log
          python3 -c "import json; r=json.load(open('qa-results/integration-client/result.json')); assert r.get('success') is True, r"
      - name: Package verified Forge edition
        run: python3 ../.github/scripts/contracts_forge_release.py package
      - name: Publish on main
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during verification; rerun against the latest commit.'
            exit 1
          fi
          version=$(sed -n 's/^mod_version=//p' contracts-bounties-forge-1.20.1/gradle.properties)
          git add -- "mod-pronto/contracts-bounties-$version.jar" "mod-pronto/contracts-bounties-$version.zip" "mod-pronto/contracts-bounties-$version.sha256" "mod-pronto/contracts-bounties-$version.build.json" "media/contracts-bounties/$version/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish verified Contracts Forge $version [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contracts-forge-${{ github.run_id }}
          path: |
            contracts-bounties-forge-1.20.1/forge-*.log
            contracts-bounties-forge-1.20.1/build/test-results/test/
            contracts-bounties-forge-1.20.1/qa-results/**/result.json
            contracts-bounties-forge-1.20.1/qa-results/**/*.png
            mod-pronto/contracts-bounties-*-forge-1.20.1.*
          retention-days: 30
