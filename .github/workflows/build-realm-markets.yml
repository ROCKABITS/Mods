name: Build Realm Markets
on:
  push:
    branches: [main]
    paths:
      - 'realm-markets/**'
      - '.github/workflows/build-realm-markets.yml'
      - '.github/scripts/package_markets.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markets-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: realm-markets
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Mod version
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Standalone native tests
        run: ./gradlew --no-daemon --console=plain -PmarketGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Install tested companion mods
        run: |
          mkdir -p compat-libs
          cp ../mod-pronto/contracts-bounties-0.3.1.jar ../mod-pronto/realmcouncil-0.2.1.jar ../mod-pronto/crown-ledger-0.1.1.jar ../mod-pronto/realm-identity-0.1.0.jar compat-libs/
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
              'contracts-bounties-0.3.1': '9746951762a6762b2cb466ca695b7d43f8669c9dc1d55c12cae1b4bd17953f0c',
              'realmcouncil-0.2.1': '3e407c391f5e2f919e246d1d889323c57ea40b30e0387e9614ae32e0e9251a0a',
              'crown-ledger-0.1.1': 'e82795f13e9f912f6729cebbad7a31dc242735b7a9e6396d6cbfb7eac02736aa',
              'realm-identity-0.1.0': '9332d133320066d42bedb08fe129dee3da0de41f261f459140dea2a12ebf1606',
          }
          for project, checksum in expected.items():
              meta = json.loads(Path('../mod-pronto/' + project + '.build.json').read_text())
              actual = hashlib.sha256(Path('compat-libs/' + project + '.jar').read_bytes()).hexdigest()
              assert actual == checksum == meta['jar_sha256'], project
          PY
      - name: Compatibility tests with released roleplay mods
        run: ./gradlew --no-daemon --console=plain -PmarketGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Actual Minecraft stalls and market menu validation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PmarketVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; report=json.load(open('qa-results/markets-client/result.json')); assert report['success'], report"
      - name: Validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Package tested release and media
        working-directory: .
        run: python3 .github/scripts/package_markets.py
      - name: Downloadable JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-markets-${{ steps.mod.outputs.version }}
          path: realm-markets/build/libs/realm-markets-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during the build. Run against latest main.'
            exit 1
          fi
          git add -- "mod-pronto/realm-markets-$MOD_VERSION.jar" "mod-pronto/realm-markets-$MOD_VERSION.zip" "mod-pronto/realm-markets-$MOD_VERSION.sha256" "mod-pronto/realm-markets-$MOD_VERSION.build.json" "media/realm-markets/$MOD_VERSION/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested Realm Markets $MOD_VERSION [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: markets-validation-${{ github.run_id }}
          path: |
            realm-markets/build.log
            realm-markets/gametests.log
            realm-markets/integration.log
            realm-markets/visual-client.log
            realm-markets/build/test-results/test/
            realm-markets/qa-results/markets-client/
            realm-markets/run/logs/latest.log
          retention-days: 14
