name: Build Realm Notifications
on:
  push:
    branches: [main]
    paths:
      - 'realm-notifications/**'
      - '.github/workflows/build-realm-notifications.yml'
      - '.github/scripts/notifications_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notifications-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[notifications-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gradle wrapper
        working-directory: realm-notifications
        run: |
          echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          python3 -c "from pathlib import Path; assert 'distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f' in Path('gradle/wrapper/gradle-wrapper.properties').read_text()"
      - name: Production build and full unit suite
        working-directory: realm-notifications
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Snapshot fixture-free production JAR
        run: python3 .github/scripts/notifications_release.py snapshot
      - name: Native regression suite without companions
        working-directory: realm-notifications
        run: ./gradlew --no-daemon --console=plain -PnotificationsGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Install eleven checksum-verified companion releases
        run: python3 .github/scripts/notifications_release.py install
      - name: Native payments and notifications with actual companion mods
        working-directory: realm-notifications
        run: ./gradlew --no-daemon --console=plain -PnotificationsGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Actual Minecraft HUD and 200-message login flood
        working-directory: realm-notifications
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 420s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PnotificationsVisualTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/notifications-client/result.json')); assert r.get('success') is True, r"
      - name: Validation summary
        if: always()
        run: python3 .github/scripts/notifications_release.py summary
      - name: Package validated JAR and ZIP
        run: python3 .github/scripts/notifications_release.py package
      - name: Downloadable tested release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notifications-${{ github.run_id }}
          path: |
            mod-pronto/realm-notifications-0.1.1.*
            media/realm-notifications/0.1.1/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested release
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/notifications_release.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Realm Notifications 0.1.1 [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notifications-validation-${{ github.run_id }}
          path: |
            realm-notifications/build.log
            realm-notifications/gametests.log
            realm-notifications/integration.log
            realm-notifications/visual-client.log
            realm-notifications/build/test-results/test/
            realm-notifications/build/notifications-release/manifest.json
            realm-notifications/qa-results/
            realm-notifications/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
