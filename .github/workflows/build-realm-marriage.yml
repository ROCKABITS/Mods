name: Build Realm Marriage and companions
on:
  push:
    branches: [main]
    paths:
      - 'realm-marriage/**'
      - 'crown-ledger/**'
      - 'realm-identity/**'
      - '.github/workflows/build-realm-marriage.yml'
      - '.github/scripts/marriage_release.py'
      - '.github/scripts/economy_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marriage-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[marriage-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Production builds and unit tests
        run: python3 .github/scripts/marriage_release.py build
      - name: Snapshot production JARs before fixtures
        run: python3 .github/scripts/marriage_release.py snapshot
      - name: Standalone Marriage, Crown and Identity native tests
        run: python3 .github/scripts/marriage_release.py native
      - name: Install fresh Crown, Identity and verified companions
        run: python3 .github/scripts/marriage_release.py install
      - name: Integrated marriage, wallet, treasury and recovery tests
        run: python3 .github/scripts/marriage_release.py integrated
      - name: Four real Minecraft clients, TCP LAN, ceremony and world reopen
        working-directory: realm-marriage
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 1500s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PmarriageVisualTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/marriage-client/result.json')); assert r.get('success') is True,r"
      - name: Bounded validation diagnostics
        if: always()
        run: python3 .github/scripts/marriage_release.py summary
      - name: Gate and package immutable tested releases
        run: python3 .github/scripts/marriage_release.py package
      - name: Downloadable tested JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marriage-release-${{ github.run_id }}
          path: |
            realm-marriage/build/marriage-release/downloads/
            media/realm-marriage/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested releases together
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/marriage_release.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Realm Marriage, Crown and Identity [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marriage-validation-${{ github.run_id }}
          path: |
            realm-marriage/build.log
            realm-identity/build.log
            crown-ledger/build.log
            */gametests.log
            realm-marriage/integration.log
            realm-marriage/visual-client.log
            */build/test-results/test/
            realm-marriage/build/marriage-release/*.json
            realm-marriage/qa-results/marriage-client/
            realm-marriage/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
