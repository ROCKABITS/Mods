name: Build Realm Villager Economy and Crown Ledger
on:
  push:
    branches: [main]
    paths:
      - 'realm-villager-economy/**'
      - 'crown-ledger/**'
      - '.github/workflows/build-realm-villager-economy.yml'
      - '.github/scripts/villager_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: villager-economy-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Other releases retain their existing workflows; this marker selects one atomic suite publisher.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[villager-economy-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Villager Economy and Crown production JARs and unit suites
        run: python3 .github/scripts/villager_release.py build
      - name: Snapshot fixture-free production JARs from this commit
        run: python3 .github/scripts/villager_release.py snapshot
      - name: Native independent Villager Economy and Crown suites
        run: python3 .github/scripts/villager_release.py native
      - name: Install fresh counterparts and verified roleplay companions
        run: python3 .github/scripts/villager_release.py install
      - name: Native monetary, persistence and recovery integration
        working-directory: realm-villager-economy
        run: python3 ../.github/scripts/villager_release.py integrated
      - name: Actual Minecraft merchant quotes, purchases, sales and public tax
        working-directory: realm-villager-economy
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 680s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PvillagerVisualTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/villager-client/result.json')); assert r.get('success') is True, r"
      - name: Validation summary and bounded failure diagnostics
        if: always()
        run: python3 .github/scripts/villager_release.py summary
      - name: Gate and package all tested releases
        run: python3 .github/scripts/villager_release.py package
      - name: Downloadable tested suite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-villager-economy-release-${{ github.run_id }}
          path: |
            realm-villager-economy/build/villager-release/downloads/
            media/realm-villager-economy/
            media/crown-ledger/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested suite in one commit
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/villager_release.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Realm Villager Economy 0.1.0 and Crown Ledger 0.2.4 [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: villager-validation-${{ github.run_id }}
          path: |
            */build.log
            */gametests.log
            */integration.log
            */visual-client.log
            */build/test-results/test/
            realm-villager-economy/build/villager-release/manifest.json
            realm-villager-economy/build/villager-release/companions.json
            */qa-results/
            realm-villager-economy/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
