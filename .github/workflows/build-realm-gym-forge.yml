name: Build Realm Gym Forge 1.20.1
on:
  push:
    branches: [main]
    paths: ['realm-gym-forge-1.20.1/**', '.github/workflows/build-realm-gym-forge.yml', '.github/scripts/gym_forge_release.py', '.github/scripts/gym_publish.py', '.github/scripts/test_gym_publish.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-gym-forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: realm-gym-forge-1.20.1
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify wrapper
        run: echo 'ed2c26eba7cfb93cc2b7785d05e534f07b5b48b5e7fc941921cd098628abca58  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Verify concurrent edition publishing
        working-directory: .
        run: python3 .github/scripts/test_gym_publish.py
      - name: Production build and domain tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee forge-build.log
      - name: Snapshot production JAR
        run: python3 ../.github/scripts/gym_forge_release.py snapshot
      - name: Native machines, loot, recipes, data and attributes
        run: ./gradlew --no-daemon --console=plain runGameTestServer 2>&1 | tee forge-native.log
      - name: Actual client controls, six minigames and world reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          timeout 1020s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PfitnessVisualTests runClient 2>&1 | tee forge-client.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
      - name: Package verified beta
        run: python3 ../.github/scripts/gym_forge_release.py package
      - name: Publish tested downloads
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: python3 .github/scripts/gym_publish.py realm-gym-forge-1.20.1
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-gym-forge-${{ github.run_id }}
          path: |
            realm-gym-forge-1.20.1/forge-*.log
            realm-gym-forge-1.20.1/build/test-results/test/
            realm-gym-forge-1.20.1/qa-results/client/*.png
            realm-gym-forge-1.20.1/qa-results/client/result.json
            realm-gym-forge-1.20.1/run/crash-reports/
            mod-pronto/realm-gym-*
            media/realm-gym/*/*.mp4
            media/realm-gym/*/*.gif
          retention-days: 30
