name: Build Realm Treasury
on:
  push:
    branches: [main]
    paths:
      - 'crown-ledger/**'
      - '.github/workflows/build-realm-treasury.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-treasury-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realm-treasury-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crown-ledger
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Production build and unit tests
        run: |
          echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
          python3 tools/treasury_release.py snapshot
      - name: Native standalone tests
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Verified released companions
        run: python3 tools/treasury_release.py install
      - name: Native integration with released mods
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Existing treasury and model client regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PcrownVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/crown-client/result.json')); assert r['success'],r"
      - name: Two real Minecraft clients and world reopening over TCP LAN
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 600s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PtreasuryClientTests runClient 2>&1 | tee lan-client.log
          python3 -c "import json; r=json.load(open('qa-results/treasury-lan/result.json')); assert r['success'],r"
      - name: Gate and package tested production JAR
        run: python3 tools/treasury_release.py package
      - name: Publish JAR, ZIP, evidence and real gameplay media
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          version=$(sed -n 's/^mod_version=//p' crown-ledger/gradle.properties)
          git add -- "mod-pronto/realm-treasury-$version.jar" "mod-pronto/realm-treasury-$version.zip" "mod-pronto/realm-treasury-$version.sha256" "mod-pronto/realm-treasury-$version.build.json" "media/realm-treasury/$version/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested Realm Treasury $version [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-treasury-validation-${{ github.run_id }}
          path: |
            crown-ledger/*.log
            crown-ledger/build/test-results/test/
            crown-ledger/build/treasury-release/
            crown-ledger/qa-results/
            crown-ledger/run/logs/latest.log
            crown-ledger/run-treasury-qa/logs/latest.log
          retention-days: 14
