name: Build Contracts & Bounties

on:
  push:
    branches: [main]
    paths:
      - 'contracts-bounties/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: contracts-bounties
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Mod version
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Native server tests
        run: ./gradlew --no-daemon --console=plain -PcontractGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Write validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Downloadable mod JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-bounties-${{ steps.mod.outputs.version }}
          path: contracts-bounties/build/libs/contracts-bounties-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-validation-${{ github.run_id }}
          path: |
            contracts-bounties/build.log
            contracts-bounties/gametests.log
            contracts-bounties/build/test-results/test/
            contracts-bounties/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
