name: Build Contracts & Bounties

on:
  push:
    branches: [main]
    paths:
      - 'contracts-bounties/**'
      - '.github/workflows/build-mod.yml'
      - '.github/scripts/package_release.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contracts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: contracts-bounties
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Mod version
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Native server tests
        run: ./gradlew --no-daemon --console=plain -PcontractGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Actual Minecraft model and texture validation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PboardVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; report=json.load(open('qa-results/boards-client/result.json')); assert report['success'], report"
      - name: Write validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Package the tested release
        working-directory: .
        run: python3 .github/scripts/package_release.py
      - name: Downloadable mod JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-bounties-${{ steps.mod.outputs.version }}
          path: contracts-bounties/build/libs/contracts-bounties-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested files directly to repository
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during the build. Run this workflow again against latest main.'
            exit 1
          fi
          git add -- "mod-pronto/contracts-bounties-$MOD_VERSION.jar" "mod-pronto/contracts-bounties-$MOD_VERSION.zip" "mod-pronto/contracts-bounties-$MOD_VERSION.sha256" "mod-pronto/contracts-bounties-$MOD_VERSION.build.json" "mod-pronto/contracts-boards-$MOD_VERSION.png" "mod-pronto/contracts-boards-$MOD_VERSION.json"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested Contracts & Bounties $MOD_VERSION [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-validation-${{ github.run_id }}
          path: |
            contracts-bounties/build.log
            contracts-bounties/gametests.log
            contracts-bounties/visual-client.log
            contracts-bounties/qa-results/boards-client/
            contracts-bounties/build/test-results/test/
            contracts-bounties/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
