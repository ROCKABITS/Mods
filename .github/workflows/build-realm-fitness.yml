name: Build Realm Fitness
on:
  push:
    branches: [main]
    paths: ['realm-fitness/**', '.github/workflows/build-realm-fitness.yml', '.github/scripts/fitness_release.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-fitness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: realm-fitness
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper
        run: echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Production build and domain tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee fitness-build.log
      - name: Snapshot production JAR
        run: python3 ../.github/scripts/fitness_release.py snapshot
      - name: Native machines, loot, recipes, data and attributes
        run: ./gradlew --no-daemon --console=plain -PfitnessGameTests runGameTestServer 2>&1 | tee fitness-native.log
      - name: Actual client controls, six minigames and world reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          timeout 1020s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PfitnessVisualTests runClient 2>&1 | tee fitness-client.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
      - name: Package verified beta
        run: python3 ../.github/scripts/fitness_release.py package
      - name: Publish tested downloads
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation; rerun against the latest commit.'
            exit 1
          fi
          version=$(sed -n 's/^mod_version=//p' realm-fitness/gradle.properties)
          git add -- "mod-pronto/realm-fitness-$version.jar" "mod-pronto/realm-fitness-$version.zip" "mod-pronto/realm-fitness-$version.sha256" "mod-pronto/realm-fitness-$version.build.json" "media/realm-fitness/$version/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish verified Realm Fitness $version Beta [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-fitness-${{ github.run_id }}
          path: |
            realm-fitness/fitness-*.log
            realm-fitness/build/test-results/test/
            realm-fitness/qa-results/client/*.png
            realm-fitness/qa-results/client/result.json
            realm-fitness/run/crash-reports/
            mod-pronto/realm-fitness-*
            media/realm-fitness/*/*.mp4
            media/realm-fitness/*/*.gif
          retention-days: 30
