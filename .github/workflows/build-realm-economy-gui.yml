name: Build Realm Economy GUI patch
on:
  push:
    branches: [main]
    paths: ['realm-economy/**', '.github/scripts/economy_gui_release.py', '.github/workflows/build-realm-economy-gui.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-economy-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[economy-gui-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: realm-economy
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper
        run: echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Production build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee gui-build.log
      - name: Snapshot production JAR
        run: python3 ../.github/scripts/economy_gui_release.py snapshot
      - name: Native standalone rules
        run: ./gradlew --no-daemon --console=plain -PeconomyGameTests runGameTestServer 2>&1 | tee gui-native.log
      - name: Real JEI overlap, bounds, resize and vanilla inventory regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 540s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PjeiGuiTests runClient 2>&1 | tee gui-jei-client.log
          python3 -c "import json; r=json.load(open('qa-results/jei-client/result.json')); assert r.get('success') is True, r"
      - name: Package verified GUI patch
        run: python3 ../.github/scripts/economy_gui_release.py package
      - name: Publish verified downloads and captures
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during verification; run against the latest commit.'
            exit 1
          fi
          version=$(sed -n 's/^mod_version=//p' realm-economy/gradle.properties)
          git add -- "mod-pronto/realm-economy-$version.jar" "mod-pronto/realm-economy-$version.zip" "mod-pronto/realm-economy-$version.sha256" "mod-pronto/realm-economy-$version.build.json" "media/realm-economy/$version/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish verified Realm Economy $version GUI patch [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Validation evidence and downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: economy-jei-gui-${{ github.run_id }}
          path: |
            realm-economy/gui-*.log
            realm-economy/build/test-results/test/
            realm-economy/qa-results/jei-client/
            mod-pronto/realm-economy-0.5.1.*
            media/realm-economy/0.5.1/
          retention-days: 30
