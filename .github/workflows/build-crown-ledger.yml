name: Build Crown Ledger
on:
  push:
    branches: [main]
    paths:
      - 'crown-ledger/**'
      - '.github/workflows/build-crown-ledger.yml'
      - '.github/scripts/package_crown.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crown-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: crown-ledger
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Standalone native tests
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Install tested companion mods
        run: |
          mkdir -p compat-libs
          cp ../mod-pronto/contracts-bounties-0.3.1.jar ../mod-pronto/realmcouncil-0.2.1.jar compat-libs/
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for project in ['contracts-bounties-0.3.1', 'realmcouncil-0.2.1']:
              meta = json.loads(Path('../mod-pronto/' + project + '.build.json').read_text())
              actual = hashlib.sha256(Path('compat-libs/' + project + '.jar').read_bytes()).hexdigest()
              assert actual == meta['jar_sha256'], project
          PY
      - name: Actual Contracts and Realm Council integration tests
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Actual Minecraft chest and menu validation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PcrownVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; report=json.load(open('qa-results/crown-client/result.json')); assert report['success'], report"
      - name: Validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Package tested release and media
        working-directory: .
        run: python3 .github/scripts/package_crown.py
      - name: Downloadable JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crown-ledger-0.1.0
          path: crown-ledger/build/libs/crown-ledger-0.1.0.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during the build. Run against latest main.'
            exit 1
          fi
          git add -- mod-pronto/crown-ledger-* media/crown-ledger/0.1.0/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Crown Ledger 0.1.0 [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crown-validation-${{ github.run_id }}
          path: |
            crown-ledger/build.log
            crown-ledger/gametests.log
            crown-ledger/integration.log
            crown-ledger/visual-client.log
            crown-ledger/build/test-results/test/
            crown-ledger/qa-results/crown-client/
            crown-ledger/run/logs/latest.log
          retention-days: 14
