name: Build Crown Ledger and Realm Markets
on:
  push:
    branches: [main]
    paths:
      - 'crown-ledger/**'
      - 'realm-markets/**'
      - '.github/workflows/build-crown-ledger.yml'
      - '.github/scripts/package_crown.py'
      - '.github/scripts/package_markets.py'
      - '.github/scripts/joint_economy_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kingdom-economy-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Suite releases are validated and published by their owning workflow.
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[notifications-suite]') && !contains(github.event.head_commit.message, '[justice-finance-suite]') && !contains(github.event.head_commit.message, '[realm-casino-release]') && !contains(github.event.head_commit.message, '[villager-economy-release]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: crown-ledger
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Joint release version
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          markets_version=$(sed -n 's/^mod_version=//p' ../realm-markets/gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$markets_version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Crown production JAR and unit tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Build Markets production JAR and unit tests
        working-directory: realm-markets
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Record both production JARs from this commit
        working-directory: .
        run: python3 .github/scripts/joint_economy_release.py snapshot
      - name: Crown standalone native tests
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Markets standalone native tests
        working-directory: realm-markets
        run: ./gradlew --no-daemon --console=plain -PmarketGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Install fresh counterparts and verified released companions
        working-directory: .
        run: python3 .github/scripts/joint_economy_release.py install
      - name: Crown native integration with fresh Markets and released roleplay mods
        run: ./gradlew --no-daemon --console=plain -PcrownGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Markets native integration with fresh Crown and released roleplay mods
        working-directory: realm-markets
        run: ./gradlew --no-daemon --console=plain -PmarketGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Actual Minecraft Crown chest and tax menu validation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PcrownVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; report=json.load(open('qa-results/crown-client/result.json')); assert report['success'], report"
      - name: Actual Minecraft market stalls and tax breakdown validation
        working-directory: realm-markets
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 300s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PmarketVisualTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; report=json.load(open('qa-results/markets-client/result.json')); assert report['success'], report"
      - name: Crown validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Markets validation summary
        if: always()
        working-directory: realm-markets
        run: python3 tools/ci_summary.py
      - name: Gate and package both tested releases and media
        working-directory: .
        run: |
          python3 .github/scripts/joint_economy_release.py check
          python3 .github/scripts/package_crown.py
          python3 .github/scripts/package_markets.py
      - name: Downloadable Crown JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crown-ledger-${{ steps.mod.outputs.version }}
          path: crown-ledger/build/libs/crown-ledger-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Downloadable Markets JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-markets-${{ steps.mod.outputs.version }}
          path: realm-markets/build/libs/realm-markets-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish both tested releases in one commit
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during the build. Run against latest main.'
            exit 1
          fi
          git add -- "mod-pronto/crown-ledger-$MOD_VERSION.jar" "mod-pronto/crown-ledger-$MOD_VERSION.zip" "mod-pronto/crown-ledger-$MOD_VERSION.sha256" "mod-pronto/crown-ledger-$MOD_VERSION.build.json" "media/crown-ledger/$MOD_VERSION/"
          git add -- "mod-pronto/realm-markets-$MOD_VERSION.jar" "mod-pronto/realm-markets-$MOD_VERSION.zip" "mod-pronto/realm-markets-$MOD_VERSION.sha256" "mod-pronto/realm-markets-$MOD_VERSION.build.json" "media/realm-markets/$MOD_VERSION/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish jointly tested Crown Ledger and Realm Markets $MOD_VERSION [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: economy-validation-${{ github.run_id }}
          path: |
            crown-ledger/build.log
            crown-ledger/gametests.log
            crown-ledger/integration.log
            crown-ledger/visual-client.log
            crown-ledger/build/test-results/test/
            crown-ledger/qa-results/crown-client/
            crown-ledger/run/logs/latest.log
            crown-ledger/build/joint-release/manifest.json
            realm-markets/build.log
            realm-markets/gametests.log
            realm-markets/integration.log
            realm-markets/visual-client.log
            realm-markets/build/test-results/test/
            realm-markets/qa-results/markets-client/
            realm-markets/run/logs/latest.log
          retention-days: 14
