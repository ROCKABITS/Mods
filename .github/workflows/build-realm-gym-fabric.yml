name: Build Realm Gym Fabric 1.21.1
on:
  push:
    branches: [main]
    paths: ['realm-gym-fabric-1.21.1/**', 'realm-gym/src/main/**', 'realm-gym/src/test/**', '.github/workflows/build-realm-gym-fabric.yml', '.github/scripts/gym_fabric_release.py', '.github/scripts/gym_publish.py', '.github/scripts/test_gym_publish.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-gym-fabric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: realm-gym-fabric-1.21.1
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper
        run: echo 'ed2c26eba7cfb93cc2b7785d05e534f07b5b48b5e7fc941921cd098628abca58  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Verify concurrent edition publishing
        working-directory: .
        run: python3 .github/scripts/test_gym_publish.py
      - name: Remapped production build and shared domain tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee fabric-build.log
      - name: Snapshot remapped production JAR
        run: python3 ../.github/scripts/gym_fabric_release.py snapshot
      - name: Boot distributed JAR on production Fabric server
        run: python3 tools/production_server_smoke.py
      - name: Native equipment, mounting, swimming, fall damage and persistence
        run: |
          mkdir -p qa-results build/gametest
          echo 'eula=true' > build/gametest/eula.txt
          ./gradlew --no-daemon --console=plain -PfitnessGameTests runGametest 2>&1 | tee fabric-native.log
      - name: Actual Fabric controls, eight mounted minigames and world reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          timeout 1020s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PfitnessVisualTests runClient 2>&1 | tee fabric-client.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
      - name: Package verified Fabric beta
        run: python3 ../.github/scripts/gym_fabric_release.py package
      - name: Publish tested downloads
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: python3 .github/scripts/gym_publish.py realm-gym-fabric-1.21.1
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-gym-fabric-${{ github.run_id }}
          path: |
            realm-gym-fabric-1.21.1/fabric-*.log
            realm-gym-fabric-1.21.1/build/test-results/test/
            realm-gym-fabric-1.21.1/qa-results/native.xml
            realm-gym-fabric-1.21.1/qa-results/production-server.*
            realm-gym-fabric-1.21.1/qa-results/client/*.png
            realm-gym-fabric-1.21.1/qa-results/client/result.json
            realm-gym-fabric-1.21.1/run/crash-reports/
            mod-pronto/realm-gym-*-fabric-*
            media/realm-gym/*-fabric-*/*.mp4
            media/realm-gym/*-fabric-*/*.gif
          retention-days: 30
