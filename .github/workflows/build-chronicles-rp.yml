name: Build Chronicles RP
on:
  push:
    branches: [main]
    paths:
      - 'chronicles-rp/**'
      - '.github/workflows/build-chronicles-rp.yml'
      - '.github/scripts/package_chronicles.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chronicles-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # A suite release is validated and published atomically by build-realm-notifications.yml.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[notifications-suite]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: chronicles-rp
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper and mod version
        id: mod
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Build production JAR and full unit suite
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build.log
      - name: Preserve clean production JAR
        run: python3 tools/release_checks.py snapshot
      - name: Verify actual pinned Origins and Jupiter runtime artifacts
        run: |
          ./gradlew --no-daemon --console=plain writePinnedRuntimeReport
          python3 tools/release_checks.py dependencies
      - name: Native tests with Origins, Jupiter and Classes
        run: ./gradlew --no-daemon --console=plain -PrpGameTests runGameTestServer 2>&1 | tee gametests.log
      - name: Native tests without optional Classes
        run: ./gradlew --no-daemon --console=plain -PrpGameTests -PrpWithoutClasses runGameTestServer 2>&1 | tee gametests-without-classes.log
      - name: Install verified released roleplay companion mods
        run: python3 tools/release_checks.py install
      - name: Native tests with all released roleplay companions
        run: ./gradlew --no-daemon --console=plain -PrpGameTests -PintegrationTests runGameTestServer 2>&1 | tee integration.log
      - name: Install virtual display for actual Minecraft clients
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
      - name: Actual Minecraft RP names, TAB and chat with companions
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 420s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PrpNameClientTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/rp-names-client/result.json')); assert r.get('success') is True, r"
      - name: Existing character creation, Origins and journal client regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 420s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PrpClientTests runClient 2>&1 | tee visual-origins-client.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
      - name: Existing Origins client regression without optional Classes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          timeout 420s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PrpClientTests -PrpWithoutClasses -PrpQaOutput="$PWD/qa-results/client-without-classes" runClient 2>&1 | tee visual-origins-without-classes.log
          python3 -c "import json; r=json.load(open('qa-results/client-without-classes/result.json')); assert r.get('success') is True, r"
      - name: Validation summary
        if: always()
        run: python3 tools/ci_summary.py
      - name: Gate and package tested release and actual Minecraft media
        working-directory: .
        run: python3 .github/scripts/package_chronicles.py
      - name: Downloadable Chronicles release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cronicasrp-${{ steps.mod.outputs.version }}
          path: |
            mod-pronto/cronicasrp-${{ steps.mod.outputs.version }}.jar
            mod-pronto/cronicasrp-${{ steps.mod.outputs.version }}.zip
            mod-pronto/cronicasrp-${{ steps.mod.outputs.version }}.sha256
            mod-pronto/cronicasrp-${{ steps.mod.outputs.version }}.build.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested release in one commit
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during the build. Run against latest main.'
            exit 1
          fi
          git add -- "mod-pronto/cronicasrp-$MOD_VERSION.jar" "mod-pronto/cronicasrp-$MOD_VERSION.zip" "mod-pronto/cronicasrp-$MOD_VERSION.sha256" "mod-pronto/cronicasrp-$MOD_VERSION.build.json" "media/chronicles-rp/$MOD_VERSION/"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested Chronicles RP $MOD_VERSION [skip ci]"
          git push origin HEAD:refs/heads/main
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chronicles-validation-${{ github.run_id }}
          path: |
            chronicles-rp/build.log
            chronicles-rp/gametests.log
            chronicles-rp/gametests-without-classes.log
            chronicles-rp/integration.log
            chronicles-rp/visual-client.log
            chronicles-rp/visual-origins-client.log
            chronicles-rp/visual-origins-without-classes.log
            chronicles-rp/build/test-results/test/
            chronicles-rp/build/release-validation/
            chronicles-rp/qa-results/
            chronicles-rp/run/logs/latest.log
            chronicles-rp/run-rp-names-qa/logs/latest.log
            chronicles-rp/run-origins-qa/logs/latest.log
            chronicles-rp/run-origins-qa-without-classes/logs/latest.log
          retention-days: 14
