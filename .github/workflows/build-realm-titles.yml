name: Build Realm Titles suite
on:
  push:
    branches: [main]
    paths:
      - 'realm-titles/**'
      - 'realm-identity/**'
      - '.github/workflows/build-realm-titles.yml'
      - '.github/scripts/titles_suite.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-titles-suite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Other releases retain their existing workflows; this marker selects one atomic suite publisher.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[realm-titles-suite]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build two production JARs and full unit suites
        run: python3 .github/scripts/titles_suite.py build
      - name: Snapshot fixture-free production JARs from this commit
        run: python3 .github/scripts/titles_suite.py snapshot
      - name: Native regression suites for both mods
        run: python3 .github/scripts/titles_suite.py native
      - name: Install fresh suite and verified roleplay companions
        run: python3 .github/scripts/titles_suite.py install
      - name: Native titles and Identity with actual fresh companions
        working-directory: realm-titles
        run: python3 ../.github/scripts/titles_suite.py integrated
      - name: Actual Minecraft seal desk, honours registry and Identity titles
        working-directory: realm-titles
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          timeout 480s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PtitlesVisualTests -PintegrationTests runClient 2>&1 | tee visual-client.log
          python3 -c "import json; r=json.load(open('qa-results/titles-client/result.json')); assert r.get('success') is True, r"
      - name: Validation summary and bounded failure diagnostics
        if: always()
        run: python3 .github/scripts/titles_suite.py summary
      - name: Gate and package all tested releases
        run: python3 .github/scripts/titles_suite.py package
      - name: Downloadable tested suite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-titles-suite-${{ github.run_id }}
          path: |
            realm-titles/build/titles-suite/downloads/
            media/realm-titles/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested suite in one commit
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main changed during validation. Build the latest source.'
            exit 1
          fi
          python3 .github/scripts/titles_suite.py stage
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish tested Realm Titles and Realm Identity [skip ci]'
          git push origin HEAD:refs/heads/main
      - name: Full validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: titles-validation-${{ github.run_id }}
          path: |
            */build.log
            */gametests.log
            realm-titles/integration.log
            realm-identity/integration.log
            realm-titles/visual-client.log
            */build/test-results/test/
            realm-titles/build/titles-suite/manifest.json
            realm-titles/build/titles-suite/companions.json
            realm-titles/qa-results/
            realm-titles/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 14
