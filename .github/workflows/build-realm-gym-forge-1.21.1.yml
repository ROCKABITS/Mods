name: Build Realm Gym Forge 1.21.1
on:
  push:
    branches: [main]
    paths: ['realm-gym-forge-1.21.1/**', 'realm-gym/src/main/**', 'realm-gym/src/test/**', '.github/workflows/build-realm-gym-forge-1.21.1.yml', '.github/scripts/gym_forge211_release.py', '.github/scripts/gym_publish.py', '.github/scripts/test_gym_publish.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: realm-gym-forge211-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: realm-gym-forge-1.21.1
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 25 Mavenizer tool
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Java 8 launcher tool
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Java 21 game and compilation
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Verify concurrent edition publishing
        working-directory: .
        run: python3 .github/scripts/test_gym_publish.py
      - name: Production build and shared domain tests
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee forge-build.log
      - name: Snapshot production JAR
        run: python3 ../.github/scripts/gym_forge211_release.py snapshot
      - name: Boot distributed JAR on production Forge server
        run: python3 tools/production_server_smoke.py
      - name: Native equipment, mounting, swimming, fall damage and persistence
        run: |
          mkdir -p qa-results run
          echo 'eula=true' > run/eula.txt
          ./gradlew --no-daemon --console=plain -PfitnessGameTests runGameTestServer 2>&1 | tee forge-native.log
      - name: Actual Forge controls, eight mounted minigames and world reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          timeout 1020s xvfb-run -a -s '-screen 0 1600x900x24' ./gradlew --no-daemon --console=plain -PfitnessVisualTests runClient 2>&1 | tee forge-client.log
          python3 -c "import json; r=json.load(open('qa-results/client/result.json')); assert r.get('success') is True, r"
      - name: Package verified Forge beta
        run: python3 ../.github/scripts/gym_forge211_release.py package
      - name: Publish tested downloads
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: python3 .github/scripts/gym_publish.py realm-gym-forge-1.21.1
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realm-gym-forge211-${{ github.run_id }}
          path: |
            realm-gym-forge-1.21.1/forge-*.log
            realm-gym-forge-1.21.1/build/test-results/test/
            realm-gym-forge-1.21.1/qa-results/native.xml
            realm-gym-forge-1.21.1/qa-results/production-server.*
            realm-gym-forge-1.21.1/qa-results/client/*.png
            realm-gym-forge-1.21.1/qa-results/client/result.json
            realm-gym-forge-1.21.1/run/crash-reports/
            mod-pronto/realm-gym-*-forge-1.21.1*
            media/realm-gym/*-forge-1.21.1*/*.mp4
            media/realm-gym/*-forge-1.21.1*/*.gif
          retention-days: 30
