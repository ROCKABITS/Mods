plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = 'realm-economy' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'villager.integration', providers.gradleProperty('integrationTests').isPresent().toString()
            systemProperty 'colony.selectedAddons', providers.gradleProperty('colonyAddonsTests').isPresent().toString()
        }
    }
    mods { realmeconomy { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    if (providers.gradleProperty('colonyAddonsTests').isPresent()) { localRuntime fileTree(dir: 'colony-addon-libs', include: ['*.jar']) }
    def colonyCoordinates = ['curse.maven:minecolonies-245506:9058295', 'curse.maven:structurize-298744:8610535', 'curse.maven:blockui-522992:7541336', 'curse.maven:domum-ornamentum-527361:7789217', 'curse.maven:multi-piston-303278:7097877']
    colonyCoordinates.each { coordinate ->
        compileOnly(coordinate) { transitive = false }
        if (providers.gradleProperty('minecoloniesTests').isPresent()) { localRuntime(coordinate) { transitive = false } }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('integrationTests').isPresent()) {
        localRuntime fileTree(dir: 'compat-libs', include: ['*.jar'])
        localRuntime 'curse.maven:origins-neoforge-1375372:8758523'
        localRuntime 'curse.maven:jupiter-1072905:7738312'
        localRuntime 'curse.maven:origins-classes-neoforge-1536425:8758587'
    }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test', Test) { useJUnitPlatform() }
if (providers.gradleProperty('economyGameTests').isPresent()) {
    sourceSets.main.java.srcDir('src/gametest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
}
if (providers.gradleProperty('economyVisualTests').isPresent()) {
    sourceSets.main.java.srcDir('src/visualtest/java')
    neoForge.runs.client {
        systemProperty 'economy.qaOutput', file('qa-results/economy-client').absolutePath
        programArguments.addAll '--width', '1600', '--height', '900'
    }
}
tasks.named('jar', Jar) {
    exclude('pt/realmeconomy/test/**', 'pt/realmeconomy/visualtest/**', 'data/realmeconomy/structure/**')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

if (providers.gradleProperty('colonyGameTests').isPresent()) {
    sourceSets.main.java.srcDir('src/colonytest/java')
    sourceSets.main.resources.srcDir('src/colonytest/resources')
    sourceSets.main.resources.srcDir('src/gametest/resources')
    neoForge.runs.gameTestServer { systemProperty 'neoforge.enabledGameTestNamespaces', 'realmeconomycolony' }
}
if (providers.gradleProperty('colonyVisualTests').isPresent()) {
    sourceSets.main.java.srcDir('src/colonyvisualtest/java')
    neoForge.runs.client {
        jvmArgument '-Xmx2G'
        systemProperty 'economy.colonyQA', 'true'
        systemProperty 'economy.colonyQAOutput', file('qa-results/colony-client').absolutePath
        programArguments.addAll '--width', '1600', '--height', '900'
    }
}
tasks.named('jar', Jar) { exclude('pt/realmeconomy/colonytest/**','pt/realmeconomy/colonyvisualtest/**','data/realmeconomycolony/structure/**') }
