plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = 'contracts-bounties' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } } }

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'daily.integration', providers.gradleProperty('dailyIntegration').isPresent().toString()
        }
    }
    mods {
        contracts { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('contractsCompat').isPresent()) {
        localRuntime fileTree(dir: 'compat-libs', include: ['*.jar'])
    }
    if (providers.gradleProperty('dailyIntegration').isPresent()) {
        localRuntime fileTree(dir: 'daily-compat-libs', include: ['*.jar'])
        localRuntime 'curse.maven:origins-neoforge-1375372:8758523'
        localRuntime 'curse.maven:jupiter-1072905:7738312'
        localRuntime 'curse.maven:origins-classes-neoforge-1536425:8758587'
    }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test', Test) { useJUnitPlatform() }

if (providers.gradleProperty('contractGameTests').isPresent()) {
    sourceSets.main.java.srcDir('src/gametest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
}
if (providers.gradleProperty('dailyGameTests').isPresent()) {
    sourceSets.main.java.srcDir('src/dailygametest/java')
    sourceSets.main.resources.srcDir('src/dailygametest/resources')
    neoForge.runs.gameTestServer { systemProperty 'neoforge.enabledGameTestNamespaces', 'contracts_daily' }
}
if (providers.gradleProperty('dailyVisualTests').isPresent()) {
    sourceSets.main.java.srcDir('src/dailyvisualtest/java')
    neoForge.runs.client {
        systemProperty 'daily.qaOutput', file('qa-results/daily-client').absolutePath
        programArguments.addAll '--width', '1600', '--height', '900'
    }
}
if (providers.gradleProperty('boardVisualTests').isPresent()) {
    sourceSets.main.java.srcDir('src/visualtest/java')
    neoForge.runs.client {
        systemProperty 'contract.qaOutput', file('qa-results/boards-client').absolutePath
        programArgument '--width'
        programArgument '1600'
        programArgument '--height'
        programArgument '900'
    }
}
tasks.named('jar', Jar) {
    exclude('pt/contracts/test/**', 'pt/contracts/visualtest/**', 'data/contracts/structure/contracts_empty.nbt', 'data/contracts_daily/**', 'data/daily_fixture/**')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
