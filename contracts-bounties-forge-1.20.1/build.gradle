plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.36'
}
version = mod_version
group = mod_group_id
base { archivesName = 'contracts-bounties' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    gameTest { java.srcDir 'src/gametest/java'; resources.srcDir 'src/gametest/resources' }
    visualTest { java.srcDir 'src/visualtest/java'; resources.srcDir 'src/visualtest/resources' }
    integrationTest { java.srcDir 'src/integrationtest/java' }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    visualTestImplementation.extendsFrom implementation
    integrationTestImplementation.extendsFrom implementation
}
sourceSets.gameTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
sourceSets.visualTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.visualTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
sourceSets.integrationTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.integrationTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { contracts { source sourceSets.main } }
        }
        client {
            jvmArgs '-Xmx2G'
            if (project.hasProperty('boardVisualTests')) {
                workingDirectory project.file('qa-results/boards-client')
                mods { contracts { source sourceSets.visualTest } }
                args '--width', '1600', '--height', '900'
                property 'contract.qaOutput', project.file('qa-results/boards-client').absolutePath
            }
            if (project.hasProperty('forgeIntegrationTests')) {
                workingDirectory project.file('qa-results/integration-client')
                mods { contracts { source sourceSets.integrationTest } }
                property 'contracts.integrationOutput', project.file('qa-results/integration-client').absolutePath
                args '--width', '1600', '--height', '900'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'contracts'
            mods { contracts { source sourceSets.gameTest } }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test') { useJUnitPlatform() }

// Keep artwork, translations and quest templates shared with the 1.21.1 edition.
// Vanilla data directories and recipe results changed in Minecraft 1.21.
processResources {
    from('../contracts-bounties/src/main/resources') {
        exclude 'META-INF/**', 'pack.mcmeta', 'data/**/recipe/**'
        eachFile { f ->
            f.path = f.path.replace('/loot_table/', '/loot_tables/')
                .replace('/tags/item/', '/tags/items/').replace('/tags/block/', '/tags/blocks/')
        }
        includeEmptyDirs = false
    }
    from('../contracts-bounties/src/main/resources') {
        include 'data/**/recipe/**'
        eachFile { f -> f.path = f.path.replace('/recipe/', '/recipes/') }
        filter { line -> line.replace('"id": "contracts:', '"item": "contracts:') }
        includeEmptyDirs = false
    }
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar { finalizedBy 'reobfJar' }
